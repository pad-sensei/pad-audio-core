name: Apply sustain audit follow-up

on:
  push:
    branches:
      - fix/sustain-non-worklet-voices

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[sustain-audit-followup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sustain-non-worklet-voices
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply follow-up
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-sustain-audit-followup.py
      - name: Verify
        run: |
          set -euo pipefail
          node --check audio-voice.js
          node tests/sustain-voice-smoke.cjs
          git diff --check
      - name: Commit permanent regression coverage
        run: |
          set -euo pipefail
          git config user.name 'daikainozaki-cyber'
          git config user.email 'daikainozaki@gmail.com'
          git rm .github/workflows/apply-sustain-audit-followup.yml .github/scripts/apply-sustain-audit-followup.py
          git add audio-voice.js CHANGELOG.md tests/sustain-voice-smoke.cjs .github/workflows/test.yml
          git commit -m 'test(audio): preserve sustain contract [sustain-audit-followup]'
          git push origin HEAD:fix/sustain-non-worklet-voices
