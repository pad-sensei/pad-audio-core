<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pad Sensei Spring Reverb Prototype</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    label { display: grid; grid-template-columns: 8rem 1fr 4rem; gap: 12px; align-items: center; margin: 14px 0; }
    button, input { font: inherit; }
    #status { color: #555; }
  </style>
</head>
<body>
  <h1>Spring Reverb Prototype</h1>
  <p>既存の <code>spring-reverb-processor.js</code> を単体で試聴するためのローカルPoC。音声ファイルを選び、dry/wet・decay・driveだけを比較する。</p>

  <p><input id="audio-file" type="file" accept="audio/*"></p>
  <p>
    <button id="play" disabled>再生</button>
    <button id="stop" disabled>停止</button>
  </p>

  <label>Dry <input id="dry" type="range" min="0" max="1" step="0.01" value="0.8"><output id="dry-value">0.80</output></label>
  <label>Wet <input id="wet" type="range" min="0" max="1" step="0.01" value="0.35"><output id="wet-value">0.35</output></label>
  <label>Decay <input id="decay" type="range" min="0" max="1" step="0.01" value="0.5"><output id="decay-value">0.50</output></label>
  <label>Drive <input id="drive" type="range" min="0" max="1" step="0.01" value="0.2"><output id="drive-value">0.20</output></label>

  <p id="status">音声ファイルを選択してください。</p>
  <script type="module" src="./spring-reverb.js"></script>
</body>
</html>
